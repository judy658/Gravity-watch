<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yılan Oyunu</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #2c3e50;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        #game-board {
            width: 400px;
            height: 400px;
            background-color: #ecf0f1;
            border: 4px solid #34495e;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .snake {
            width: 20px;
            height: 20px;
            position: absolute;
            background-color: #27ae60;
            border-radius: 4px;
        }
        .food {
            width: 20px;
            height: 20px;
            position: absolute;
            background-color: #e74c3c;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div id="game-board"></div>

    <script>
        const gameBoard = document.getElementById('game-board');
        const boardSize = 400;
        const cellSize = 20;

        let snake = [{ x: 160, y: 200 }];
        let food = { x: 300, y: 200 };
        let direction = 'RIGHT';
        let gameInterval;

        function drawBoard() {
            gameBoard.innerHTML = '';
        }

        function drawSnake() {
            snake.forEach(segment => {
                const snakeElement = document.createElement('div');
                snakeElement.style.left = segment.x + 'px';
                snakeElement.style.top = segment.y + 'px';
                snakeElement.classList.add('snake');
                gameBoard.appendChild(snakeElement);
            });
        }

        function drawFood() {
            const foodElement = document.createElement('div');
            foodElement.style.left = food.x + 'px';
            foodElement.style.top = food.y + 'px';
            foodElement.classList.add('food');
            gameBoard.appendChild(foodElement);
        }

        function moveSnake() {
            let head = { x: snake[0].x, y: snake[0].y };

            if (direction === 'UP') head.y -= cellSize;
            if (direction === 'DOWN') head.y += cellSize;
            if (direction === 'LEFT') head.x -= cellSize;
            if (direction === 'RIGHT') head.x += cellSize;

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                food = { 
                    x: Math.floor(Math.random() * (boardSize / cellSize)) * cellSize, 
                    y: Math.floor(Math.random() * (boardSize / cellSize)) * cellSize 
                };
            } else {
                snake.pop();
            }
        }

        function checkCollision() {
            const head = snake[0];
            if (head.x < 0 || head.x >= boardSize || head.y < 0 || head.y >= boardSize) return true;
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) return true;
            }
            return false;
        }

        function gameLoop() {
            drawBoard();
            moveSnake();
            if (checkCollision()) {
                clearInterval(gameInterval);
                alert('Oyun Bitti! Sayfayı yenileyerek tekrar oynayabilirsin.');
                return;
            }
            drawSnake();
            drawFood();
        }

        document.addEventListener('keydown', event => {
            switch (event.key) {
                case 'ArrowUp':
                    if (direction !== 'DOWN') direction = 'UP';
                    break;
                case 'ArrowDown':
                    if (direction !== 'UP') direction = 'DOWN';
                    break;
                case 'ArrowLeft':
                    if (direction !== 'RIGHT') direction = 'LEFT';
                    break;
                case 'ArrowRight':
                    if (direction !== 'LEFT') direction = 'RIGHT';
                    break;
            }
        });

        gameInterval = setInterval(gameLoop, 100);
    </script>
</body>
</html>
